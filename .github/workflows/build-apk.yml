name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk maa-bhajan.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: maa-bhajan-apk
          path: maa-bhajan.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Maa ke Bhajan — latest APK
          body: |
            Download **maa-bhajan.apk** below and install it on the phone.
            (Enable "Install unknown apps" for your browser/Files app when prompted.)
          files: maa-bhajan.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
